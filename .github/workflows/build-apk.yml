name: Build Xiaomi 14 Pro Cam APK v1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-extract project ZIP if uploaded directly from phone
        run: |
          if [ ! -d "app" ]; then
            ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found $ZIP_FILE, extracting project files..."
              unzip -o -q "$ZIP_FILE"
            fi
          fi
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and Debug Keystore
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else echo "GEMINI_API_KEY=dummy_key" > .env; fi
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK v1.01
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Xiaomi 14 Pro Cam v1.01 APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi14ProCam-v1.01-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
